<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Lumos Connect</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/accessibility.css">
    <link rel="stylesheet" href="./agenda.css">
    <link rel="icon" type="image/png" href="../../assets/images/Mascote.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ——— MODAL ——— */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
        .modal-box{background:var(--surface,#fff);border-radius:16px;max-width:440px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
        .modal-box h2{margin:0 0 20px;font-size:1.1rem;font-weight:700;color:var(--text,#2B3B36)}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:.85rem;color:var(--text,#2B3B36)}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:2px solid var(--border,#D3D9CC);border-radius:10px;font-size:.9rem;background:var(--surface,#fff);color:var(--text,#2B3B36);box-sizing:border-box}
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary,#4E6F5A);outline:none}
        .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

        /* ——— PAGE LAYOUT ——— */
        .agenda-page{display:flex;flex-direction:column;gap:24px}
        .agenda-top-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
        .agenda-top-header h1{font-size:1.6rem;font-weight:800;color:var(--text,#2B3B36);margin:0}
        .agenda-top-header p{color:var(--text-secondary,#5B6B65);font-size:.9rem;margin:4px 0 0}

        /* ——— BIG CALENDAR ——— */
        .big-calendar{background:var(--surface,#fff);border-radius:16px;padding:20px;border:1px solid var(--border,#D3D9CC)}
        .cal-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px}
        .cal-nav h2{font-size:1.1rem;font-weight:700;min-width:160px;text-align:center;color:var(--text,#2B3B36)}
        .btn-nav{background:var(--surface,#fff);border:1px solid var(--border,#D3D9CC);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;color:var(--text,#2B3B36);transition:all .15s}
        .btn-nav:hover{background:var(--primary,#4E6F5A);color:#fff;border-color:var(--primary,#4E6F5A)}

        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
        .cal-weekday{text-align:center;font-size:.75rem;font-weight:700;color:var(--text-secondary,#5B6B65);padding:6px 0}
        .cal-day{display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;font-size:.9rem;cursor:pointer;border:1px solid var(--border,#D3D9CC);background:var(--background,#F5F3EC);transition:all .15s;position:relative;font-weight:500}
        .cal-day:hover{border-color:var(--primary,#4E6F5A);background:var(--secondary,#DCE7DA)}
        .cal-day.today{background:var(--primary,#4E6F5A);color:#fff;border-color:var(--primary,#4E6F5A);font-weight:700}
        .cal-day.selected:not(.today){background:var(--secondary,#DCE7DA);border-color:var(--primary,#4E6F5A);font-weight:700}
        .cal-day.has-events::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--primary,#4E6F5A)}
        .cal-day.today.has-events::after{background:#fff}
        .cal-day.empty{background:none;border-color:transparent;pointer-events:none}

        /* ——— DAY PANEL ——— */
        .day-panel{background:var(--surface,#fff);border-radius:16px;border:2px solid var(--primary,#4E6F5A);padding:20px}
        .day-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .day-panel-title{display:flex;flex-direction:column}
        .day-panel-weekday{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--text-secondary,#5B6B65);letter-spacing:.05em}
        .day-panel-date{font-size:1.2rem;font-weight:800;color:var(--text,#2B3B36)}

        /* Horizontal day scroller */
        .day-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
        .day-scroller::-webkit-scrollbar{display:none}
        .day-chip{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:8px 6px;border-radius:12px;cursor:pointer;border:1px solid var(--border,#D3D9CC);background:var(--background,#F5F3EC);transition:all .15s;flex-shrink:0}
        .day-chip:hover{border-color:var(--primary,#4E6F5A)}
        .day-chip.active{background:var(--primary,#4E6F5A);color:#fff;border-color:var(--primary,#4E6F5A)}
        .day-chip .chip-weekday{font-size:.65rem;font-weight:700;text-transform:uppercase;opacity:.7}
        .day-chip .chip-day{font-size:1rem;font-weight:800;margin-top:2px}
        .day-chip .chip-dot{width:5px;height:5px;border-radius:50%;background:var(--primary,#4E6F5A);margin-top:4px}
        .day-chip.active .chip-dot{background:#fff}

        /* Events */
        .events-list-panel{display:flex;flex-direction:column;gap:10px;min-height:80px}
        .event-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--background,#F5F3EC);border-radius:12px;cursor:pointer;transition:background .15s}
        .event-row:hover{background:var(--secondary,#DCE7DA)}
        .event-row.done{opacity:.6}
        .event-checkbox{width:20px;height:20px;border-radius:50%;border:2px solid var(--border,#D3D9CC);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
        .event-row.done .event-checkbox{background:var(--primary,#4E6F5A);border-color:var(--primary,#4E6F5A)}
        .event-row.done .event-checkbox::after{content:'✓';color:#fff;font-size:.7rem;font-weight:700}
        .event-info-col{flex:1}
        .event-title-row{font-size:.9rem;font-weight:600;color:var(--text,#2B3B36)}
        .event-row.done .event-title-row{text-decoration:line-through;color:var(--text-secondary)}
        .event-sub{font-size:.78rem;color:var(--text-secondary,#5B6B65);margin-top:2px}
        .event-tag{font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--secondary,#DCE7DA);color:var(--primary,#4E6F5A);white-space:nowrap;flex-shrink:0}
        .no-events{text-align:center;color:var(--text-secondary);padding:20px 0;font-size:.9rem}

        /* Sidebar footer fix */
        .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border,#D3D9CC);display:flex;flex-direction:column;gap:2px}
        .focus-mode-btn,.logout-btn{width:100%;background:none;border:none;cursor:pointer}
        .logout-btn:hover{color:#ef4444!important}
    </style>
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/logo/robolumosconnect.png" alt="Lumos Connect">
            <span>Lumos Connect</span>
        </div>
        <nav class="sidebar-nav" aria-label="Navegação principal">
            <a href="/lumos-connect/front-end/pages/inicio/inicio.css" class="nav-item"><i data-lucide="house"></i><span>Início</span></a>
            <a href="/lumos-connect/front-end/pages/atividades/atividades.html" class="nav-item"><i data-lucide="notebook-tabs"></i><span>Atividades</span></a>
            <a href="/lumos-connect/front-end/pages/progresso/progresso.html" class="nav-item"><i data-lucide="chart-no-axes-combined"></i><span>Progresso</span></a>
            <a href="/lumos-connect/front-end/pages/agenda/agenda.html" class="nav-item active" aria-current="page"><i data-lucide="calendar-days"></i><span>Agenda</span></a>
            <a href="/lumos-connect/front-end/pages/configuracoes/configuracoes.html" class="nav-item"><i data-lucide="settings"></i><span>Configurações</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item focus-mode-btn" id="focusModeBtn" aria-label="Modo foco"><i data-lucide="eye"></i><span>Modo Foco</span></button>
            <button class="nav-item logout-btn" id="logoutBtn" aria-label="Sair"><i data-lucide="log-out"></i><span>Sair</span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="agenda-page">

            <div class="agenda-top-header">
                <div>
                    <h1>Agenda</h1>
                    <p>Organize seus compromissos e estudos</p>
                </div>
                <button class="primary-button" id="btnAddEvent">
                    <i data-lucide="plus"></i> Novo evento
                </button>
            </div>

            <!-- Big Calendar -->
            <div class="big-calendar">
                <div class="cal-nav">
                    <button class="btn-nav" id="prevMonth" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button>
                    <h2 id="monthTitle">—</h2>
                    <button class="btn-nav" id="nextMonth" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button>
                </div>
                <div class="cal-grid" id="calGrid" role="grid"></div>
            </div>

            <!-- Day Panel -->
            <div class="day-panel">
                <div class="day-panel-header">
                    <div class="day-panel-title">
                        <span class="day-panel-weekday" id="selectedWeekday">—</span>
                        <span class="day-panel-date" id="selectedDate">—</span>
                    </div>
                    <button class="primary-button" id="btnAddEventDay">
                        <i data-lucide="plus"></i> Adicionar
                    </button>
                </div>

                <!-- Horizontal day scroller -->
                <div class="day-scroller" id="dayScroller"></div>

                <!-- Events for selected day -->
                <div class="events-list-panel" id="dayEvents">
                    <p class="no-events">Nenhum evento neste dia.</p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Modal novo/editar evento -->
<div id="eventModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-box">
        <h2 id="eventModalTitle">Novo evento</h2>
        <div class="form-group">
            <label for="evTitle">Título *</label>
            <input type="text" id="evTitle" placeholder="Nome do evento" required>
        </div>
        <div class="form-group">
            <label for="evDate">Data *</label>
            <input type="datetime-local" id="evDate" required>
        </div>
        <div class="form-group">
            <label for="evType">Tipo</label>
            <select id="evType">
                <option value="">Geral</option>
                <option value="prova">Prova</option>
                <option value="tarefa">Tarefa</option>
                <option value="estudo">Sessão de estudo</option>
                <option value="evento">Evento escolar</option>
                <option value="exercicio">Exercício</option>
                <option value="leitura">Leitura</option>
            </select>
        </div>
        <div class="form-group">
            <label for="evDesc">Descrição</label>
            <textarea id="evDesc" rows="3" placeholder="Detalhes (opcional)"></textarea>
        </div>
        <div class="modal-actions">
            <button class="secondary-button" id="btnCancelEvent">Cancelar</button>
            <button class="primary-button" id="btnSaveEvent">Salvar</button>
        </div>
    </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/authGuard.js"></script>
<script src="../../js/accessibility.js"></script>
<script src="./agenda.js"></script>
</body>
</html>
