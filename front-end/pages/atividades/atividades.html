<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades | Lumos Connect</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/accessibility.css">
    <link rel="stylesheet" href="./atividades.css">
    <link rel="icon" type="image/png" href="../../assets/images/Mascote.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Activity player styles */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
        .modal-box{background:var(--bg-primary,#fff);border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-color,#e0e0e0)}
        .modal-header h2{font-size:1.1rem;font-weight:700;color:var(--text-primary,#1a1a1a);margin:0}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border-color,#e0e0e0);display:flex;gap:12px;justify-content:flex-end}
        .btn-close-modal{background:none;border:none;cursor:pointer;color:var(--text-secondary,#666);padding:4px;border-radius:6px;display:flex;align-items:center}
        .btn-close-modal:hover{background:var(--bg-secondary,#f5f5f5)}

        /* Question styles */
        .question-block{margin-bottom:24px}
        .question-text{font-weight:600;margin-bottom:12px;color:var(--text-primary,#1a1a1a);font-size:1rem}
        .options-list{display:flex;flex-direction:column;gap:8px}
        .option-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border:2px solid var(--border-color,#e0e0e0);border-radius:10px;background:none;cursor:pointer;text-align:left;font-size:.9rem;color:var(--text-primary,#1a1a1a);transition:all .2s}
        .option-btn:hover{border-color:var(--primary,#4E6F5A);background:var(--primary-light,#eaf2ec)}
        .option-btn.selected{border-color:var(--primary,#4E6F5A);background:var(--primary-light,#eaf2ec);font-weight:600}
        .option-btn.correct{border-color:#22c55e;background:#f0fdf4}
        .option-btn.incorrect{border-color:#ef4444;background:#fef2f2}
        .option-letter{width:28px;height:28px;border-radius:50%;background:var(--border-color,#e0e0e0);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
        .option-btn.selected .option-letter{background:var(--primary,#4E6F5A);color:#fff}

        /* Flashcard */
        .flashcard-container{perspective:1000px;cursor:pointer;user-select:none}
        .flashcard{width:100%;min-height:200px;position:relative;transform-style:preserve-3d;transition:transform .6s}
        .flashcard.flipped{transform:rotateY(180deg)}
        .flashcard-front,.flashcard-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:32px;font-size:1.3rem;font-weight:600;text-align:center}
        .flashcard-front{background:var(--primary,#4E6F5A);color:#fff}
        .flashcard-back{background:var(--bg-secondary,#f5f5f5);color:var(--text-primary,#1a1a1a);transform:rotateY(180deg)}
        .flashcard-hint{text-align:center;margin-top:16px;color:var(--text-secondary,#888);font-size:.85rem}
        .flashcard-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}

        /* Score/Result */
        .result-block{text-align:center;padding:24px 0}
        .result-score{font-size:3rem;font-weight:800;color:var(--primary,#4E6F5A)}
        .result-msg{font-size:1.1rem;margin-top:8px;color:var(--text-secondary,#666)}
        .feedback-item{display:flex;gap:8px;align-items:flex-start;margin:8px 0;padding:10px;border-radius:8px;font-size:.9rem}
        .feedback-item.correct{background:#f0fdf4;color:#166534}
        .feedback-item.incorrect{background:#fef2f2;color:#991b1b}
        .feedback-item.neutral{background:#f8f8f8;color:#555}

        /* Progress bar in modal */
        .activity-progress-bar{height:6px;background:var(--border-color,#e0e0e0);border-radius:3px;margin-bottom:20px}
        .activity-progress-fill{height:100%;background:var(--primary,#4E6F5A);border-radius:3px;transition:width .3s}

        /* Tags on cards */
        .activity-type-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--primary-light,#eaf2ec);color:var(--primary,#4E6F5A);margin-bottom:8px}

        /* Matching */
        .matching-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
        .matching-col{display:flex;flex-direction:column;gap:8px}
        .matching-item{padding:10px 14px;border:2px solid var(--border-color,#ddd);border-radius:10px;cursor:pointer;font-size:.9rem;transition:all .2s;background:var(--bg-primary,#fff)}
        .matching-item.selected-left{border-color:var(--primary,#4E6F5A);background:var(--primary-light,#eaf2ec)}
        .matching-item.matched{border-color:#22c55e;background:#f0fdf4;pointer-events:none}
        .matching-item.wrong{border-color:#ef4444;background:#fef2f2}

        /* Filters */
        .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
        .filter-btn{padding:6px 14px;border-radius:20px;border:2px solid var(--border-color,#ddd);background:none;cursor:pointer;font-size:.85rem;color:var(--text-secondary,#666);transition:all .2s}
        .filter-btn.active{border-color:var(--primary,#4E6F5A);background:var(--primary,#4E6F5A);color:#fff}
        .filter-btn:hover:not(.active){border-color:var(--primary,#4E6F5A);color:var(--primary,#4E6F5A)}
    </style>
</head>
<body>
<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/logo/robolumosconnect.png" alt="Lumos Connect">
            <span>Lumos Connect</span>
        </div>
        <nav class="sidebar-nav" aria-label="Navegação principal">
            <a href="/lumos-connect/front-end/pages/inicio/inicio.html" class="nav-item">
                <i data-lucide="house"></i><span>Início</span>
            </a>
            <a href="/lumos-connect/front-end/pages/atividades/atividades.html" class="nav-item active" aria-current="page">
                <i data-lucide="notebook-tabs"></i><span>Atividades</span>
            </a>
            <a href="/lumos-connect/front-end/pages/progresso/progresso.html" class="nav-item">
                <i data-lucide="chart-no-axes-combined"></i><span>Progresso</span>
            </a>
            <a href="/lumos-connect/front-end/pages/agenda/agenda.html" class="nav-item">
                <i data-lucide="calendar-days"></i><span>Agenda</span>
            </a>
            <a href="/lumos-connect/front-end/pages/configuracoes/configuracoes.html" class="nav-item">
                <i data-lucide="settings"></i><span>Configurações</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item focus-mode-btn" id="focusModeBtn" aria-label="Modo foco">
                <i data-lucide="eye"></i><span>Modo Foco</span>
            </button>
            <button class="nav-item logout-btn" id="logoutBtn" aria-label="Sair">
                <i data-lucide="log-out"></i><span>Sair</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1>Atividades</h1>
            <p>Explore e complete suas atividades</p>
        </header>

        <!-- Filters -->
        <div class="filter-bar" role="group" aria-label="Filtros">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="QUIZ">Quiz</button>
            <button class="filter-btn" data-filter="FLASHCARD">Flashcard</button>
            <button class="filter-btn" data-filter="TRUE_FALSE">Verdadeiro/Falso</button>
            <button class="filter-btn" data-filter="MULTIPLE_CHOICE">Múlt. Escolha</button>
            <button class="filter-btn" data-filter="MATCHING">Associação</button>
            <button class="filter-btn" data-filter="STANDARD">Texto</button>
        </div>

        <div id="activitiesGrid" class="activities-grid" role="list">
            <p class="empty-state">Carregando atividades...</p>
        </div>
    </main>
</div>

<!-- ACTIVITY MODAL -->
<div id="activityModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">Atividade</h2>
            <button class="btn-close-modal" id="closeModal" aria-label="Fechar">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/authGuard.js"></script>
<script src="../../js/accessibility.js"></script>
<script src="./atividades.js"></script>
</body>
</html>
